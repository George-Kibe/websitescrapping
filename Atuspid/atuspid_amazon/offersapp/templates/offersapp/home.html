<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Amazon Offers</title>
  </head>
  <body>
    <main class="container my-5">
      <h1 class="h3 mb-4">Amazon Offers</h1>

      {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">
        {{ message }}
      </div>
      {% endfor %}

      {% for slug, label in jobs.items %}
      <button type="button" class="btn btn-primary me-2 mb-2" data-bs-toggle="modal" data-bs-target="#modal-{{ slug }}">
        {{ label }}
      </button>
      {% endfor %}

      {% for slug, label in jobs.items %}
      <div class="modal fade" id="modal-{{ slug }}" tabindex="-1" aria-labelledby="modal-{{ slug }}-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <form class="modal-content" action="{% url 'run_job' slug %}" method="post">
            {% csrf_token %}
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="modal-{{ slug }}-title">{{ label }}</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Check Amazon for {{ label|lower }} and send them to Telegram?</div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Confirm</button>
            </div>
          </form>
        </div>
      </div>
      {% endfor %}
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
